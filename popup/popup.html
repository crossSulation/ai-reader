<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>

<header class="head">
  <div class="logo">A</div>
  <div class="titles">
    <h1 data-i18n="appName">AI Reader</h1>
    <p id="modelLine" data-i18n="popupLoading">Loading…</p>
  </div>
</header>

<div class="tip" id="tip" hidden>
  <span id="tipText" data-i18n="popupNoModel"></span>
  <button id="goSetup" data-i18n="popupGoSetup">Set up</button>
</div>

<section class="recent">
  <div class="section-title" data-i18n="popupRecentTitle">Recent</div>
  <div id="recentList"></div>
  <div class="empty" id="recentEmpty" hidden data-i18n="popupRecentEmpty"></div>
</section>

<footer class="foot">
  <button class="primary" id="openHistory" data-i18n="popupAllHistory">All history</button>
  <button id="openSettings" data-i18n="popupSettings">Settings</button>
</footer>

<div class="kbd-hint"><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>E</kbd> <span data-i18n="popupKbdHint">Explain the selected text</span></div>

<script type="module" src="popup.js"></script>
</body>
</html>
