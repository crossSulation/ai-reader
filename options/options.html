<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title data-i18n="optDocTitle">AI Reader · Settings</title>
<link rel="stylesheet" href="options.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">A</div>
    <div class="titles">
      <h1 data-i18n="appName">AI Reader</h1>
      <p data-i18n="appTagline">Select to ask · bring your own model</p>
    </div>
    <nav class="tabs">
      <button class="tab active" data-tab="general" data-i18n="optTabSettings">Settings</button>
      <button class="tab" data-tab="history"><span data-i18n="optTabHistory">History</span> <span class="badge" id="histCount">0</span></button>
    </nav>
  </div>
</header>

<main class="page">

  <!-- ============================ 设置 ============================ -->
  <section class="panel active" id="panel-general">

    <div class="card">
      <div class="card-head">
        <h2 data-i18n="optModelCardTitle">Model</h2>
        <p data-i18n="optModelCardDesc">Set it up once.</p>
      </div>

      <div class="row">
        <label for="preset" data-i18n="optProvider">Provider</label>
        <select id="preset"></select>
      </div>

      <div class="grid2">
        <div class="row">
          <label for="protocol" data-i18n="optProtocol">API protocol</label>
          <select id="protocol">
            <option value="openai" data-i18n="optProtocolOpenai">OpenAI-compatible</option>
            <option value="anthropic" data-i18n="optProtocolAnthropic">Anthropic native</option>
          </select>
        </div>
        <div class="row">
          <label for="model" data-i18n="optModelName">Model name</label>
          <input type="text" id="model" placeholder="deepseek-chat" spellcheck="false">
        </div>
      </div>

      <div class="row">
        <label for="baseUrl" data-i18n="optBaseUrl">Base URL</label>
        <input type="text" id="baseUrl" placeholder="https://api.deepseek.com/v1" spellcheck="false">
        <p class="hint" data-i18n-html="optBaseUrlHintHtml"></p>
      </div>

      <div class="row">
        <label for="apiKey" data-i18n="optApiKey">API Key</label>
        <div class="key-wrap">
          <input type="password" id="apiKey" placeholder="sk-..." spellcheck="false" autocomplete="off">
          <button class="ghost-btn" id="toggleKey" type="button" data-i18n="optShowKey">Show</button>
        </div>
        <p class="hint" id="keyHint" data-i18n="optKeyHintEmpty"></p>
      </div>

      <div class="row">
        <label for="temperature"><span data-i18n="optTemperature">Randomness</span> <span class="value" id="tempValue">0.3</span></label>
        <input type="range" id="temperature" min="0" max="1" step="0.1" value="0.3">
        <p class="hint" data-i18n="optTempHint"></p>
      </div>

      <div class="row">
        <label for="contextBudget"><span data-i18n="optBudget">Context budget</span> <span class="value" id="contextBudgetValue">30000</span> <span data-i18n="optBudgetUnit">characters</span></label>
        <input type="range" id="contextBudget" min="6000" max="120000" step="2000" value="30000">
        <p class="hint" data-i18n="optBudgetHint"></p>
      </div>

      <div class="actions">
        <button class="primary-btn" id="saveBtn" data-i18n="optSaveAndTest">Save &amp; test connection</button>
        <button class="ghost-btn" id="testOnlyBtn" data-i18n="optTestOnly">Test only</button>
        <span class="action-note" data-i18n="optTestNote"></span>
      </div>

      <div class="dirty-hint" id="dirtyHint" hidden data-i18n-html="optDirtyHtml"></div>

      <div class="result" id="testResult" hidden></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2 data-i18n="optLanguage">Interface language</h2>
        <p data-i18n="optLanguageHint"></p>
      </div>
      <div class="row">
        <select id="language"></select>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2 data-i18n="optInteractCardTitle">Interaction</h2>
        <p data-i18n="optInteractCardDesc"></p>
      </div>

      <div class="row">
        <label data-i18n="optTriggerLabel">After selecting text</label>
        <div class="radios" id="triggerRadios">
          <label class="radio">
            <input type="radio" name="trigger" value="chip">
            <span class="radio-body">
              <b data-i18n="optTriggerChipTitle"></b>
              <i data-i18n="optTriggerChipDesc"></i>
            </span>
          </label>
          <label class="radio">
            <input type="radio" name="trigger" value="auto">
            <span class="radio-body">
              <b data-i18n="optTriggerAutoTitle"></b>
              <i data-i18n="optTriggerAutoDesc"></i>
            </span>
          </label>
          <label class="radio">
            <input type="radio" name="trigger" value="off">
            <span class="radio-body">
              <b data-i18n="optTriggerOffTitle"></b>
              <i data-i18n-html="optTriggerOffDescHtml"></i>
            </span>
          </label>
        </div>
      </div>

      <div class="row">
        <label for="defaultMode" data-i18n="optDefaultMode">Default action</label>
        <select id="defaultMode"></select>
      </div>

      <div class="row">
        <label data-i18n="optBubbleModes">Actions shown in the bubble</label>
        <div class="checks" id="modeChecks"></div>
        <p class="hint" data-i18n="optBubbleModesHint"></p>
      </div>

      <label class="switch-row">
        <input type="checkbox" id="dblclickAsk">
        <span class="switch"></span>
        <span class="switch-text">
          <b data-i18n="optDblclickTitle"></b>
          <i data-i18n="optDblclickDesc"></i>
        </span>
      </label>

      <div class="row">
        <label for="quickAskMode" data-i18n="optQuickAskMode">Action for double-click</label>
        <select id="quickAskMode"></select>
      </div>

      <label class="switch-row">
        <input type="checkbox" id="layered">
        <span class="switch"></span>
        <span class="switch-text">
          <b data-i18n="optLayeredTitle"></b>
          <i data-i18n="optLayeredDesc"></i>
        </span>
      </label>
    </div>

    <div class="card">
      <div class="card-head">
        <h2 data-i18n="optRecordsCardTitle">Records</h2>
        <p data-i18n="optRecordsCardDesc"></p>
      </div>

      <label class="switch-row">
        <input type="checkbox" id="autoSave">
        <span class="switch"></span>
        <span class="switch-text">
          <b data-i18n="optAutoSaveTitle"></b>
          <i data-i18n="optAutoSaveDesc"></i>
        </span>
      </label>

      <div class="row">
        <label for="maxHistory"><span data-i18n="optMaxHistory">Records kept</span> <span class="value" id="maxHistoryValue">800</span></label>
        <input type="range" id="maxHistory" min="50" max="3000" step="50" value="800">
        <p class="hint" data-i18n="optMaxHistoryHint"></p>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2 data-i18n="optIntegrateCardTitle">Note integrations</h2>
        <p data-i18n="optIntegrateCardDesc"></p>
      </div>

      <div class="row">
        <label for="obsidianVault" data-i18n="optObsidianVault">Obsidian vault</label>
        <input type="text" id="obsidianVault" data-i18n-placeholder="optObsidianVaultPlaceholder" spellcheck="false">
        <p class="hint" data-i18n="optObsidianVaultHint"></p>
      </div>

      <div class="row">
        <label for="obsidianFolder" data-i18n="optObsidianFolder">Obsidian folder</label>
        <input type="text" id="obsidianFolder" data-i18n-placeholder="optObsidianFolderPlaceholder" spellcheck="false">
        <p class="hint" data-i18n="optObsidianFolderHint"></p>
      </div>

      <div class="row">
        <label for="notionToken" data-i18n="optNotionToken">Notion integration token</label>
        <input type="password" id="notionToken" data-i18n-placeholder="optNotionTokenPlaceholder" spellcheck="false" autocomplete="off">
        <p class="hint" data-i18n-html="optNotionTokenHintHtml"></p>
      </div>

      <div class="row">
        <label for="notionParentId" data-i18n="optNotionParent">Notion parent page</label>
        <input type="text" id="notionParentId" data-i18n-placeholder="optNotionParentPlaceholder" spellcheck="false">
        <p class="hint" data-i18n-html="optNotionParentHintHtml"></p>
      </div>

      <div class="actions">
        <button class="ghost-btn" id="notionConnect" data-i18n="optNotionConnect">Connect &amp; test Notion</button>
        <button class="ghost-btn" id="obsidianTest" data-i18n="optObsidianTest">Write a test note to Obsidian</button>
        <span class="action-note" id="integrateNote"></span>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2 data-i18n="optPermCardTitle">Site access</h2>
        <p data-i18n="optPermCardDesc"></p>
      </div>
      <div id="permList" class="perm-list"></div>
      <div class="actions">
        <button class="ghost-btn" id="refreshPerm" data-i18n="optRefreshPerm">Refresh list</button>
        <span class="action-note" data-i18n="optPermNote"></span>
      </div>
    </div>

    <div class="card danger-card">
      <div class="card-head">
        <h2 data-i18n="optSafetyTitle">Security</h2>
      </div>
      <ul class="notes">
        <li data-i18n-html="optSafetyItem1Html"></li>
        <li data-i18n-html="optSafetyItem2Html"></li>
        <li data-i18n-html="optSafetyItem3Html"></li>
        <li data-i18n-html="optSafetyItem4Html"></li>
      </ul>
    </div>

  </section>

  <!-- ============================ 历史 ============================ -->
  <section class="panel" id="panel-history">
    <div class="card">
      <div class="card-head">
        <h2 data-i18n="optHistoryCardTitle">Archive</h2>
        <p data-i18n="optHistoryCardDesc"></p>
      </div>

      <div class="toolbar">
        <input type="search" id="search" data-i18n-placeholder="optSearchPlaceholder" spellcheck="false">
        <select id="domainFilter"><option value="" data-i18n="optAllSources">All sources</option></select>
        <label class="mini-check"><input type="checkbox" id="onlyStar"><span data-i18n="optOnlyStar">Saved only</span></label>
        <span class="spacer"></span>
        <button class="primary-btn" id="exportBtn" data-i18n="optExportMd">Export Markdown</button>
        <button class="ghost-btn" id="exportObsidianBtn" data-i18n="optExportObsidian">Send to Obsidian</button>
        <button class="ghost-btn" id="exportNotionBtn" data-i18n="optExportNotion">Send to Notion</button>
        <button class="ghost-btn" id="clearBtn" data-i18n="optClear">Clear</button>
      </div>

      <div class="stat-line" id="histStat"></div>
      <div class="hist-list" id="histList"></div>
      <div class="empty" id="histEmpty" hidden data-i18n="optHistEmpty"></div>
    </div>
  </section>

</main>

<div class="toast" id="toast" hidden></div>
<script type="module" src="options.js"></script>
</body>
</html>
